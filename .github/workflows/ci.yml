name: CI

on:
  push:
    branches: [main, 'etapa-*']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, build y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      # Solo dependencias de producción: las de desarrollo no llegan a la imagen (ver docs/testing.md).
      - run: npm audit --omit=dev --audit-level=high

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag nexo-pro-api:ci .
