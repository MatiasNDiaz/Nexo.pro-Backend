name: CodeQL

# Análisis estático de seguridad de GitHub (SEG §21): inyecciones, XSS, secretos en el código y
# otros patrones peligrosos. Los resultados quedan en la pestaña Security del repositorio.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analizar TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
